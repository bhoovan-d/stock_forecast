[project]
name = "fno-momentum"
version = "0.1.0"
description = "Clean-room NSE FnO options momentum paper-research system."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fno_momentum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
