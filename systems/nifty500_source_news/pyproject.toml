[project]
name = "nifty500-source-news"
version = "0.1.0"
description = "Clean-room NIFTY 500 source/news paper-research system."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nifty500_source_news"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
