[project]
name = "asymmetry"
version = "0.1.0"
description = "Indian equities catalyst + regime scanner. Decision support, not execution."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "sqlmodel>=0.0.22",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "loguru>=0.7",
    "rich>=13.7",
    "feedparser>=6.0",
    "openai>=1.40",
    "tenacity>=8.3",
]

[project.optional-dependencies]
upstox = ["upstox-python-sdk>=2.28"]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[project.scripts]
asymmetry = "asymmetry.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asymmetry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: hits a live upstream; skips itself when unreachable",
]
